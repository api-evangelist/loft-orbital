aid: loft-orbital
name: Loft Orbital
description: 'Loft Orbital is a space infrastructure company operating under the banner "Space Made
  Simple" that integrates, launches, and operates low-Earth-orbit satellites so customers can fly
  physical payloads or deploy software "virtual missions" without building or operating their own
  spacecraft. Its Cockpit mission-control platform lets operators task payloads, monitor telemetry,
  and downlink data in real time through a secure web UI or an authenticated API, and a customer SDK
  provides frameworks, documentation, and satellite APIs (including Azure Orbital space-edge deploys)
  for onboard sensors and compute. The Cockpit API and developer docs are gated behind login at
  api.cockpit.loftorbital.com, so no public specification is available. Backed by Uncork Capital.'
